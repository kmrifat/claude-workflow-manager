<!DOCTYPE html>
<!--
  The dashboard. One screen: a row per running task under each product, then a
  reverse-chronological event feed — the "what happened while I was asleep" view.

  Plain HTML, no build step, no dependencies. It is served by Vapor from the
  target's resource bundle and is meant to stay editable by hand.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkflowHost</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #fff; --line: #e3e6ea; --text: #16181d;
    --dim: #6b7280; --accent: #2563eb;
    --green: #16a34a; --red: #dc2626; --amber: #d97706; --purple: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --line: #262b35; --text: #e6e8ec;
      --dim: #9aa1ad; --accent: #60a5fa;
      --green: #4ade80; --red: #f87171; --amber: #fbbf24; --purple: #a78bfa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    background: var(--panel); position: sticky; top: 0; z-index: 2;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 650; }
  .spacer { flex: 1; }
  .muted { color: var(--dim); font-size: 12px; }
  .pill {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .pill.live { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); }
  .pill.stale { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, transparent); }
  main { padding: 20px; display: grid; gap: 18px; max-width: 1100px; margin: 0 auto; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .sect-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 11px 14px; border-bottom: 1px solid var(--line);
  }
  .sect-head h2 { font-size: 13px; margin: 0; font-weight: 650; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .status { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px; }
  .status.running { color: var(--green); background: color-mix(in srgb, var(--green) 15%, transparent); }
  .status.review  { color: var(--purple); background: color-mix(in srgb, var(--purple) 15%, transparent); }
  .status.failed  { color: var(--red); background: color-mix(in srgb, var(--red) 15%, transparent); }
  .status.queued  { color: var(--amber); background: color-mix(in srgb, var(--amber) 15%, transparent); }
  .status.done    { color: var(--dim); background: color-mix(in srgb, var(--dim) 15%, transparent); }
  .add { color: var(--green); } .del { color: var(--red); }
  .empty { padding: 16px 14px; color: var(--dim); font-size: 13px; }
  .feed { list-style: none; margin: 0; padding: 0; max-height: 460px; overflow-y: auto; }
  .feed li { display: flex; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .feed li:last-child { border-bottom: none; }
  .feed time { color: var(--dim); font-size: 12px; white-space: nowrap; min-width: 92px; }
  .kind { font-size: 11px; font-weight: 600; min-width: 78px; }
  .kind.pr_opened { color: var(--purple); }
  .kind.failed { color: var(--red); }
  .kind.dispatched { color: var(--accent); }
  .kind.blocked, .kind.stopped { color: var(--amber); }
  .kind.commit { color: var(--dim); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  #error {
    display: none; margin: 0; padding: 10px 20px;
    background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); font-size: 13px;
  }
  .claimed { color: var(--amber); font-size: 11px; }
  .blocked { color: var(--red); font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>WorkflowHost</h1>
  <span class="pill" id="version">—</span>
  <span class="spacer"></span>
  <span class="pill" id="socket">connecting…</span>
  <span class="muted" id="seen">—</span>
</header>
<p id="error"></p>
<main id="root"></main>

<script>
// The token is in the URL the host printed on first run. Kept in sessionStorage
// so a reload doesn't need it again, but never in localStorage — it should not
// outlive the tab.
const params = new URLSearchParams(location.search);
if (params.get('token')) {
  sessionStorage.setItem('token', params.get('token'));
  history.replaceState({}, '', location.pathname);
}
const token = sessionStorage.getItem('token') || '';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function ago(iso) {
  if (!iso) return 'never';
  const seconds = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (seconds < 60) return Math.round(seconds) + 's ago';
  if (seconds < 3600) return Math.round(seconds / 60) + 'm ago';
  if (seconds < 86400) return Math.round(seconds / 3600) + 'h ago';
  return Math.round(seconds / 86400) + 'd ago';
}

function runRow(view) {
  const r = view.run, g = view.git;
  const stats = !g ? '<span class="muted">—</span>'
    : g.commits.length === 0 ? '<span class="muted">no commits</span>'
    : `${g.commits.length}c · ${g.filesChanged}f · <span class="add">+${g.insertions}</span> <span class="del">−${g.deletions}</span>`;
  const last = g && g.commits.length ? ago(g.commits[0].date) : (r.startedAt ? ago(r.startedAt) : '—');
  const session = r.sessionId
    ? ` · <a href="claude://session/${esc(r.sessionId)}">session</a>` : '';
  return `<tr>
    <td>#${r.issueNumber} ${esc(view.issueTitle || '')}${session}</td>
    <td class="mono">${esc(r.branch || '—')}</td>
    <td>${stats}</td>
    <td class="muted">${last}</td>
    <td><span class="status ${esc(r.status)}">${esc(r.status)}</span></td>
  </tr>`;
}

function readyRow(issue) {
  const flags = [];
  if (issue.isClaimed || (issue.assignees || []).length)
    flags.push(`<span class="claimed">claimed by ${esc((issue.assignees || []).join(', '))}</span>`);
  if ((issue.blockedBy || []).length)
    flags.push(`<span class="blocked">blocked by ${issue.blockedBy.map(n => '#' + n).join(', ')}</span>`);
  if (issue.area) flags.push(`<span class="muted">${esc(issue.area)}</span>`);
  return `<tr>
    <td><a href="${esc(issue.url)}" target="_blank" rel="noopener">#${issue.number}</a> ${esc(issue.title)}</td>
    <td>${flags.join(' · ') || '<span class="muted">ready</span>'}</td>
  </tr>`;
}

function render(state) {
  $('version').textContent = 'v' + state.hostVersion;
  $('seen').textContent = 'host last seen ' + ago(state.generatedAt);

  const sections = state.repos.map(repo => {
    // Staleness has to be visible: a sleeping Mac otherwise looks like a quiet one.
    const age = repo.lastPolledAt ? (Date.now() - new Date(repo.lastPolledAt).getTime()) / 1000 : null;
    const stale = age === null || age > 300;
    const pollPill = `<span class="pill ${stale ? 'stale' : 'live'}">polled ${ago(repo.lastPolledAt)}</span>`;

    const runs = repo.activeRuns.length
      ? `<table><thead><tr><th>Issue</th><th>Branch</th><th>Changes</th><th>Last activity</th><th>Status</th></tr></thead>
         <tbody>${repo.activeRuns.map(runRow).join('')}</tbody></table>`
      : '<p class="empty">Nothing running.</p>';

    const ready = repo.readyIssues.length
      ? `<table><thead><tr><th>Ready</th><th></th></tr></thead>
         <tbody>${repo.readyIssues.map(readyRow).join('')}</tbody></table>`
      : '<p class="empty">Ready column is empty.</p>';

    return `<section>
      <div class="sect-head">
        <h2>${esc(repo.id)}</h2>
        <span class="muted">${repo.activeRuns.length}/${repo.maxConcurrent} running</span>
        <span class="spacer"></span>${pollPill}
      </div>
      ${runs}${ready}
    </section>`;
  }).join('');

  const feed = state.recentEvents.length
    ? `<ul class="feed">${state.recentEvents.map(e => `<li>
        <time>${ago(e.at)}</time>
        <span class="kind ${esc(e.kind)}">${esc(e.kind)}</span>
        <span>${esc(e.detail || '')}</span></li>`).join('')}</ul>`
    : '<p class="empty">No events yet.</p>';

  $('root').innerHTML = sections +
    `<section><div class="sect-head"><h2>Recent activity</h2></div>${feed}</section>`;
}

async function load() {
  try {
    const response = await fetch('/api/state', { headers: { Authorization: 'Bearer ' + token } });
    if (response.status === 401) throw new Error('Unauthorized — open the URL the host printed on first run.');
    if (!response.ok) throw new Error('HTTP ' + response.status);
    render(await response.json());
    $('error').style.display = 'none';
  } catch (error) {
    $('error').textContent = error.message;
    $('error').style.display = 'block';
  }
}

// The socket is a nudge, not a data channel. Polling on focus is the fallback,
// because a socket that died quietly must not look like a system with nothing
// to report.
function connect() {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  const socket = new WebSocket(`${scheme}://${location.host}/ws?token=${encodeURIComponent(token)}`);
  socket.onopen = () => { $('socket').textContent = 'live'; $('socket').className = 'pill live'; };
  socket.onmessage = load;
  socket.onclose = () => {
    $('socket').textContent = 'reconnecting…';
    $('socket').className = 'pill stale';
    setTimeout(connect, 3000);
  };
  socket.onerror = () => socket.close();
}

window.addEventListener('focus', load);
setInterval(load, 30000);
load();
connect();
</script>
</body>
</html>
