# Builds Pitwall's DMG and attaches it to a GitHub release.
#
# Publish a release (tag it v1.2.0) and this builds the app at that tag, packs
# it as Pitwall-1.2.0.dmg — the app beside an Applications shortcut, so
# installing is a drag — and uploads it, with its SHA-256, to the release.
#
# All the work is Tools/release.sh, the same script a release from a Mac runs;
# this file only gives it a keychain and, when the secrets exist, a certificate.
#
# Signing, decided by which secrets are set:
#
#   Developer ID, notarized — when all four are set. Opens with no warning.
#     DEVELOPER_ID_CERTIFICATE_P12        base64 of the exported .p12
#     DEVELOPER_ID_CERTIFICATE_PASSWORD   the password it was exported with
#     NOTARY_APPLE_ID                     the Apple ID email
#     NOTARY_APP_PASSWORD                 an app-specific password for it
#   (APPLE_TEAM_ID is optional; release.sh defaults to the project's team.)
#
#   Ad-hoc — when they are not. The DMG works, but macOS refuses the first
#   launch until the user clicks Open Anyway in Privacy & Security; the
#   release notes say so.
#
# Pull requests that touch the release path build an ad-hoc DMG as an
# artifact, so a broken release is found before a release is cut.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp, e.g. 1.2.0 (built as an artifact, not attached to a release)"
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Tools/release.sh

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: Build DMG
    # Xcode 26 is the default here; the app builds against the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 60

    env:
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 != '' && secrets.NOTARY_APPLE_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          case "${{ github.event_name }}" in
            release)           RAW="${{ github.event.release.tag_name }}" ;;
            workflow_dispatch) RAW="${{ inputs.version }}" ;;
            *)                 RAW="0.0.0-pr${{ github.event.number }}" ;;
          esac
          VERSION="${RAW#v}"
          # MARKETING_VERSION must be numbers and dots; a "-beta" suffix stays
          # in the file name only.
          MARKETING="${VERSION%%-*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (marketing $MARKETING, build ${{ github.run_number }})"

      # The newest Xcode on the image, preferring 27 — what the app is built
      # with day to day. The image's default was 26.6, which could not compile
      # it. Listed first, so a log says which one was used.
      - name: Choose Xcode
        run: |
          find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Import the Developer ID certificate
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'R3YZ9PF9N6' }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Apple's Developer ID intermediate, so codesign can build the chain
          # from the certificate to a root the system trusts.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Lets codesign use the key without a prompt nobody is there to answer.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Searched first, ahead of the login keychain; the existing list is
          # split into one path per word on purpose.
          EXISTING=$(security list-keychains -d user | tr -d '"' | xargs)
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING

          xcrun notarytool store-credentials ClaudeWM \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$TEAM_ID" \
            --password "$NOTARY_APP_PASSWORD" --keychain "$KEYCHAIN"

          echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Build, sign and package
        env:
          SIGNING: ${{ env.HAS_DEVELOPER_ID == 'true' && 'manual' || 'adhoc' }}
          VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: Tools/release.sh

      - name: Name the DMG and checksum it
        id: dmg
        run: |
          SOURCE=".xcbuild/release/Pitwall-${{ steps.version.outputs.marketing }}.dmg"
          DMG=".xcbuild/release/Pitwall-${{ steps.version.outputs.version }}.dmg"
          [ "$SOURCE" = "$DMG" ] || mv "$SOURCE" "$DMG"
          (cd "$(dirname "$DMG")" && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256")
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          cat "$DMG.sha256"

      - name: Keep the build log if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: .xcbuild/release/archive.log
          if-no-files-found: ignore

      - name: Keep the DMG as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pitwall-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.dmg.outputs.path }}.sha256
          retention-days: 14

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" "${{ steps.dmg.outputs.path }}" "${{ steps.dmg.outputs.path }}.sha256" --clobber

          if [ "$HAS_DEVELOPER_ID" != "true" ]; then
            # Say so where people download it: an ad-hoc app is refused on
            # first launch, and the fix is one click they would not guess.
            NOTE=$(printf '%s\n' \
              "" \
              "---" \
              "**First launch:** this build is not notarized, so macOS will refuse to open it the first time." \
              "Open **System Settings ▸ Privacy & Security**, scroll down, and click **Open Anyway** next to Pitwall." \
              "Or run: \`xattr -dr com.apple.quarantine /Applications/Pitwall.app\`")
            BODY=$(gh release view "$TAG" --json body --jq .body)
            case "$BODY" in
              *"First launch:"*) ;;
              *) gh release edit "$TAG" --notes "$BODY$NOTE" ;;
            esac
          fi

      - name: Remove the keychain
        if: always() && env.NOTARY_KEYCHAIN != ''
        run: security delete-keychain "$NOTARY_KEYCHAIN" || true
